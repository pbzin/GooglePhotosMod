android.useAndroidX=true
# android.enableJetifier is deprecated and will be removed in version 10.0
android.enableJetifier=true

# Performance optimization for large projects
android.dependency.excludeLibraryComponentsFromConstraints=true
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# Suppress warnings for deprecated options and obsolete APIs
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL,LIBRARY_CONSTRAINTS_SHOULD_BE_DISABLED

# Remove deprecated options that were setting old defaults
# android.defaults.buildfeatures.resvalues=true
# android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
# android.enableAppCompileTimeRClass=false
# android.usesSdkInManifest.disallowed=false
# android.builtInKotlin=false
# android.newDsl=false

org.gradle.daemon=false
